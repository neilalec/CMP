x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 5000
      BACKEND_PUBLIC_URL: https://cmp.zapto.org/api
      DATABASE_PATH: /app/data/app.db
      SQUADJS_BRIDGE_URL: http://squadjs:3001
    volumes:
      - backend_data:/app/data
    ports:
      - "5000:5000"
    depends_on:
      - squadjs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_PASSWORD_AUTH_ENABLED: "0"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  squadjs:
    build:
      context: ./squadjs
    volumes:
      - ./squadjs/config.json:/app/config.json:ro
    expose:
      - "3001"
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

volumes:
  backend_data:
  caddy_data:
  caddy_config:
