services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 5000
      BACKEND_PUBLIC_URL: https://cmp.zapto.org/api
      DATABASE_PATH: /app/data/app.db
      SQUADJS_BRIDGE_URL: http://squadjs:3001
    volumes:
      - backend_data:/app/data
    ports:
      - "5000:5000"
    depends_on:
      - squadjs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    expose:
      - "80"
    restart: unless-stopped

  squadjs:
    build:
      context: ./squadjs
    volumes:
      - ./squadjs/config.json:/app/config.json:ro
    expose:
      - "3001"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  backend_data:
